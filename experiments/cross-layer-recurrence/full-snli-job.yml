apiVersion: batch/v1
kind: Job
metadata:
  name: ggong1-2a-full-snli
  labels:
    k8s-app: ggong1-2a-full-snli
spec:
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        k8s-app: ggong1-2a-full-snli
    spec:
      restartPolicy: Never
      containers:
        - name: sweep
          image: ubuntu:24.04
          workingDir: "/~ /TaskCE"
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-dev gcc g++ ca-certificates
              test -x "/~ /TaskCE/.venv/bin/python"
              export TASKCE_RUN_ROOT="/~ /TaskCE/data/vectorized-2a-full-snli-v1"
              export TASKCE_BACKEND=vectorized_search_2a
              export TASKCE_REFERENCE_RESULTS="/~ /TaskCE/baselines/57a1e74/experiments/cross-layer-recurrence/results"
              mkdir -p "$TASKCE_RUN_ROOT/source"
              tar -xzf /revision/source.tgz -C "$TASKCE_RUN_ROOT/source"
              if [ ! -e "$TASKCE_RUN_ROOT/inputs" ]; then
                  ln -sfn "/~ /TaskCE/data/nautilus-1111/optimized/inputs" "$TASKCE_RUN_ROOT/inputs"
              fi
              exec "/~ /TaskCE/.venv/bin/python" -u "$TASKCE_RUN_ROOT/source/experiments/cross-layer-recurrence/full_snli.py"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            - name: OPENBLAS_NUM_THREADS
              value: "2"
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 12Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: revision
              mountPath: /revision
            - name: devmain
              mountPath: "/~ /"
      volumes:
        - name: revision
          configMap:
            name: ggong1-2a-full-snli
        - name: devmain
          persistentVolumeClaim:
            claimName: ggong1-dev-main
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-H100-80GB-HBM3
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-L40S
                      - NVIDIA-A100-80GB-PCIe

                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-RTX-A6000
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-RTX-A5000
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-A10
                      - NVIDIA-L4
                      - Quadro-RTX-6000
                      - Quadro-RTX-8000
                      - NVIDIA-TITAN-RTX
                      - NVIDIA-RTX-A4000
