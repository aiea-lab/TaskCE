name = "snli"
description = "SNLI validation study for LiquidAI/LFM2.5-1.2B-Thinking"

[model]
model_id = "LiquidAI/LFM2.5-1.2B-Thinking"
lora_repo = "Heroi/multitune-lora-backup"
lora_task = "snli"
layers = [
    "model.embedding_norm",
    "model.layers.14.feed_forward",
    "model.layers.13.feed_forward",
    "model.layers.12.feed_forward",
    "model.layers.11.feed_forward",
    "model.layers.10.feed_forward",
    "model.layers.9.feed_forward",
    "model.layers.8.feed_forward",
]

[model.layer_aliases]
"layer.8" = "model.layers.8.feed_forward"
"layer.9" = "model.layers.9.feed_forward"
"layer.10" = "model.layers.10.feed_forward"
"layer.11" = "model.layers.11.feed_forward"
"layer.12" = "model.layers.12.feed_forward"
"layer.13" = "model.layers.13.feed_forward"
"layer.14" = "model.layers.14.feed_forward"
"embedding_norm" = "model.embedding_norm"

[dataset]
name = "snli"
hf_id = "stanfordnlp/snli"
split = "validation"
feature_columns = ["premise", "hypothesis"]
label_column = "label"
labels = ["entailment", "neutral", "contradiction"]
tokenizer_name = "spacy-pos-snli-features"
tokenizer_uses_pos = false

[dataset.class_token_ids]
entailment = 806
neutral = 25919
contradiction = 10913

[dataset.prompt]
system = "Determine the relationship between the `premise` and `hypothesis` and respond with `entailment`, `neutral`, or `contradiction`."
user_template = "Premise: {premise}\nHypothesis: {hypothesis}"

[search]
alpha = 0.055
min_acts = 500
beam = 40
length = 48
max_iterations = 48
seed = 20261111
backend = "vectorized_search_2a"

[artifacts]
baseline_commit = "57a1e74"
prepared_inputs_relpaths = ["nautilus-1111/inputs", "inputs"]
joint_manifest_name = "snli_10k_v1.json"
joint_parent_csv_relpath = "experiments/joint-search/results/parents/layer.8.csv"
joint_baseline_results_relpath = "experiments/joint-search/results"
recurrence_results_relpath = "experiments/cross-layer-recurrence/results"
recurrence_layers = [
    "layer.8",
    "layer.9",
    "layer.10",
    "layer.11",
    "layer.12",
    "layer.13",
    "layer.14",
    "embedding_norm",
]
recurrence_later_start = "layer.9"
recurrence_later_end = "embedding_norm"
