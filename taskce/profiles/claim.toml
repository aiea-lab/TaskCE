name = "claim"
description = "VitaminC claim verification study for LiquidAI/LFM2.5-1.2B-Thinking"

[model]
model_id = "LiquidAI/LFM2.5-1.2B-Thinking"
lora_repo = "Heroi/multitune-lora-backup"
lora_task = "claim"
layers = [
    "model.embedding_norm",
    "model.layers.14.feed_forward",
    "model.layers.13.feed_forward",
    "model.layers.12.feed_forward",
    "model.layers.11.feed_forward",
    "model.layers.10.feed_forward",
    "model.layers.9.feed_forward",
    "model.layers.8.feed_forward",
]

[model.layer_aliases]
"layer.8" = "model.layers.8.feed_forward"
"layer.9" = "model.layers.9.feed_forward"
"layer.10" = "model.layers.10.feed_forward"
"layer.11" = "model.layers.11.feed_forward"
"layer.12" = "model.layers.12.feed_forward"
"layer.13" = "model.layers.13.feed_forward"
"layer.14" = "model.layers.14.feed_forward"
"embedding_norm" = "model.embedding_norm"

[dataset]
name = "claim"
hf_id = "tals/vitaminc"
split = "validation[:10_000]"
feature_columns = ["claim", "evidence"]
label_column = "label"
labels = ["supports", "refutes", "not enough info"]
tokenizer_name = "spacy-pos-claim-features"
tokenizer_uses_pos = false

[dataset.class_token_ids]
supports = 56744
refutes = 1891
"not enough info" = 2897

[dataset.prompt]
system = "Determine the relationship between the `claim` and `evidence` and respond with `supports`, `refutes`, or `not enough info`."
user_template = "Evidence: {evidence}\nClaim: {claim}"

[search]
alpha = 0.052
min_acts = 500
beam = 40
length = 48
max_iterations = 48
seed = 20261111
backend = "vectorized_search_2a"

[artifacts]
prepared_inputs_relpaths = ["claim/inputs", "inputs"]
